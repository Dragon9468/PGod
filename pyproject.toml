[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgod"
version = "0.1.0"
description = "PGod: Autonomous Ambient Presence Guardian & Zero-Friction Proof-of-Life Daemon"
authors = [{ name = "PGDSecurity Sovereign Core", email = "creator@pgdsecurity.internal" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
]

[project.scripts]
pgod = "pgod.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

