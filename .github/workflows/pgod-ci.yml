name: PGod Ambient Guardian Cloud CI & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    name: "PGod Cloud Test & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          pip install -e .
          pip install pytest httpx

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Build Wheel & Sdist
        run: |
          python -m build --sdist --wheel --outdir dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pgod-wheels
          path: dist/
